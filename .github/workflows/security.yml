name: Security and regression checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: npm run test:graph
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --output-file /tmp/requirements-audit.txt > /dev/null
          uvx pip-audit==2.10.1 -r /tmp/requirements-audit.txt --no-deps --disable-pip --progress-spinner off
      - name: Audit locked JavaScript dependencies
        run: npm audit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
